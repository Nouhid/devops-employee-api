apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: employee-api-ingress
  namespace: employee-api
spec:
  ingressClassName: nginx
  rules:
    - host: employee-api.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: employee-api
                port:
                  number: 8000
