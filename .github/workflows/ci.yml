name: FastAPI CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ==========================================
  # JOB 1: BUILD, LINT AND TEST
  # ==========================================
  build-and-test:
    name: Build and Test Application
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r requirements.lock

      - name: Ruff Code Linting
        run: python -m ruff check main.py tests/

      - name: Run Pytest with Coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -v \
            --cov=main \
            --cov-report=term-missing \
            --cov-fail-under=80


  # ==========================================
  # JOB 2: GITLEAKS SECRET DETECTION
  # ==========================================
  secret-scan:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"



  trivy-security-scan:

    name: Trivy Vulnerability Scanner

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # Step 1: Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v6

      # Step 2: Scan dependencies and configurations
      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-results.json
          exit-code: "1"

      # Step 3: Upload security report
      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-results.json
          if-no-files-found: ignore
          retention-days: 14
