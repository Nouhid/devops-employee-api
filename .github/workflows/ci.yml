name: DevSecOps CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:

  # ==========================================
  # JOB 1: BUILD, LINT AND TEST
  # ==========================================
  build-and-test:
    name: Build and Test Application
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock


      - name: Install Dependencies
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r requirements.lock

      - name: Ruff Code Linting
        run: python -m ruff check main.py tests/

      - name: Run Pytest with Coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -v \
            --cov=main \
            --cov-report=term-missing \
            --cov-fail-under=80


  # ==========================================
  # JOB 2: GITLEAKS SECRET DETECTION
  # ==========================================
  secret-scan:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"


  # ==========================================
  # JOB 3: TRIVY FILESYSTEM SECURITY SCAN
  # ==========================================
  trivy-security-scan:
    name: Trivy Vulnerability Scanner
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-results.json
          exit-code: "1"

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-security-report
          path: trivy-results.json
          if-no-files-found: ignore
          retention-days: 14


  # ==========================================
  # JOB 4: PYTHON DEPENDENCY VULNERABILITY AUDIT
  # ==========================================
  dependency-audit:
    name: Python Dependency Vulnerability Audit
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: |
          python -m pip install \
            --only-binary=:all: \
            pip-audit==2.10.1

      - name: Run Dependency Audit
        run: |
          pip-audit \
            --require-hashes \
            --disable-pip \
            -r requirements.lock \
            --format json \
            --output pip-audit-report.json

      - name: Upload Dependency Audit Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit-report
          path: pip-audit-report.json
          if-no-files-found: ignore
          retention-days: 14


  # ==========================================
  # JOB 5: SONARQUBE CLOUD CODE ANALYSIS
  # ==========================================
  sonarqube-analysis:
    name: SonarQube Cloud Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=.
            -Dsonar.tests=tests
            -Dsonar.exclusions=tests/**,venv/**,.venv/**,**/__pycache__/**


  # ==========================================
  # JOB 6: DOCKER BUILD, SCAN AND PUSH
  # ==========================================
  docker-build-scan-push:
    name: Docker Build, Scan and Push
    runs-on: ubuntu-latest

    needs:
      - build-and-test
      - secret-scan
      - trivy-security-scan
      - dependency-audit
      - sonarqube-analysis

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: nouhid28/devops-employee-api:${{ github.sha }}

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: nouhid28/devops-employee-api:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag \
            nouhid28/devops-employee-api:${{ github.sha }} \
            nouhid28/devops-employee-api:latest

          docker push nouhid28/devops-employee-api:${{ github.sha }}
          docker push nouhid28/devops-employee-api:latest
