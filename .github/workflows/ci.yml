name: FastAPI CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ==========================================
  # JOB 1: BUILD, LINT AND TEST
  # ==========================================
  build-and-test:
    name: Build and Test Application
    runs-on: ubuntu-24.04

    steps:

      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v6

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      # 3. Upgrade pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # 4. Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r requirements.lock

      # 5. Static code analysis
      - name: Ruff Code Linting
        run: python -m ruff check main.py tests/

      # 6. Automated testing and coverage
      - name: Run Pytest with Coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -v \
            --cov=main \
            --cov-report=term-missing \
            --cov-fail-under=80


  # ==========================================
  # JOB 2: SECRET DETECTION
  # ==========================================
  secret-scan:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-24.04

    steps:

      # 1. Checkout complete Git history
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 2. Scan repository for secrets
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
