apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: employee-api
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Nouhid/devops-employee-api.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: employee-api

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true

  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: employee-api
      namespace: employee-api
      jsonPointers:
        - /spec/replicas
